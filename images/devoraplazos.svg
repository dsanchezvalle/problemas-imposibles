<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260">
<title>Villano del caos</title>
<desc>Personaje con máscara de tela completa, lentes angulares y traje oscuro. Tocado y accesorios de caos en estilo cómic.</desc>
