<stop offset=".28" stop-color="#111628" stop-opacity="0"/><stop offset="1" stop-color="#111628" stop-opacity=".7"/>
</radialGradient>
<radialGradient id="moon-haze">
<stop stop-color="#a97ce8" stop-opacity=".16"/><stop offset="1" stop-color="#a97ce8" stop-opacity="0"/>
</radialGradient>
